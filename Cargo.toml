[package]
name = "reviewfox"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
dirs = "6"
git2 = "0.20"
gpui = "=0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
similar = "2.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = [
    "NSApplication",
    "NSGraphics",
    "NSImage",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "=0.3.2", features = ["NSData", "NSGeometry"] }
raw-window-handle = "=0.6.2"
