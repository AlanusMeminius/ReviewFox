[package]
name = "reviewfox"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
dirs = "6"
git2 = "0.20"
gpui = "=0.2.2"
gpui_http_client = "=0.2.2"
anyhow = "1"
bytes = "1"
futures = "0.3"
http = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util"] }
zed-reqwest = { version = "=0.12.15-zed", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "rustls-tls-native-roots",
    "stream",
] }
keyring = { version = "4.2.0", default-features = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
similar = "2.7"
unicode-segmentation = "1.12"
url = "2"
gpui_util = "=0.2.2"
pulldown-cmark = { version = "=0.12.0", default-features = false }
regex = "1.5"
log = "0.4"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cmake = "0.7"

[dev-dependencies]
tempfile = "3"
gpui = { version = "=0.2.2", features = ["test-support"] }
gpui_http_client = { version = "=0.2.2", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = [
    "NSApplication",
    "NSBezierPath",
    "NSGraphics",
    "NSImage",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "=0.3.2", features = ["NSData", "NSGeometry"] }
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.build-dependencies]
winres = "=0.1.12"
