<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReviewFox UI prototype (throwaway)</title>
  <!--
    PROTOTYPE — throwaway. Not production.
    Question: ReviewFox main + Diff chrome look.
    VERDICT (2026-09-25): A accepted — see docs/adr/0003-beads-rail-shell-from-prototype-a.md
    B/C parked. Keep this file as the visual primary source.
    open prototype/review-shell.html
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #172033;
      --muted: #596579;
      --faint: #98a2b3;
      --line: #dfe3ea;
      --surface: #ffffff;
      --sidebar: #f4f5f7;
      --hover: #e9ebef;
      --selected: #e5e7eb;
      --selected-soft: #f1f5ff;
      --accent: #2457d6;
      --add: #1a7f4b;
      --add-bg: #e8f7ee;
      --del: #b42318;
      --del-bg: #fdeceb;
      --mod-bg: #e8f0fe;
      --mod-bg-deep: #d4e4fc;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "IBM Plex Sans", sans-serif;
      color: var(--text);
      background: #c5ccd6;
      overflow: hidden;
    }
    button, input, select { font: inherit; }
    .proto-root {
      height: 100%; padding: 16px;
      display: flex; gap: 12px; align-items: stretch; justify-content: center;
    }
    .desk { display: flex; gap: 12px; max-width: 1500px; width: 100%; height: 100%; min-width: 0; }

    .win {
      background: var(--surface);
      border: 1px solid #b4bcc8;
      border-radius: 10px;
      box-shadow: 0 16px 36px rgba(23, 32, 51, 0.16);
      display: flex; flex-direction: column;
      overflow: hidden; min-width: 0;
    }
    .traffic { display: flex; gap: 6px; align-items: center; flex-shrink: 0; width: 52px; }
    .traffic i { width: 10px; height: 10px; border-radius: 50%; display: block; background: #d0d5de; }
    .traffic .r { background: #ff5f57; }
    .traffic .y { background: #febc2e; }
    .traffic .g { background: #28c840; }

    .mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
    .meta { font-size: 12px; color: var(--muted); }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #proto-switcher {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      z-index: 9999; display: flex; align-items: center; gap: 10px;
      background: #111827; color: #f9fafb; border-radius: 999px;
      padding: 8px 14px; box-shadow: 0 8px 28px rgba(0,0,0,.35);
      font-size: 13px; user-select: none;
    }
    #proto-switcher button {
      background: #374151; color: #fff; border: 0;
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    }
    #proto-switcher .label { min-width: 240px; text-align: center; }
    #proto-switcher .hint { color: #9ca3af; font-size: 11px; }
    .state-dump {
      position: fixed; right: 10px; bottom: 58px; z-index: 9998;
      width: 260px; max-height: 36vh; overflow: auto;
      background: #0f172a; color: #e2e8f0;
      font-family: "IBM Plex Mono", monospace; font-size: 10px;
      padding: 10px; border-radius: 8px; opacity: 0.9; white-space: pre-wrap;
    }

    /* ========== A: Beads-like three column ========== */
    .A-main { flex: 1.25; min-width: 0; }
    .A-diff { flex: 1.05; min-width: 0; }

    .A-cols {
      flex: 1; display: grid; min-height: 0;
      grid-template-columns: 220px minmax(260px, 1fr) 280px;
    }
    .A-cols.repos-collapsed { grid-template-columns: 0 minmax(260px, 1fr) 280px; }

    /* Left sidebar — frosted, NO right border; color boundary only */
    .A-side {
      background: var(--sidebar);
      display: flex; flex-direction: column; min-width: 0; overflow: hidden;
    }
    .A-side-chrome {
      height: 36px; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 0 8px 0 12px;
      /* no bottom border — titlebar has no divider */
    }
    .A-side-toggle {
      width: 26px; height: 26px; border: 0; border-radius: 6px;
      background: transparent; color: var(--muted); cursor: pointer;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .A-side-toggle:hover { background: var(--hover); }
    .A-side-toggle svg { width: 16px; height: 16px; }

    .A-side-body { flex: 1; overflow: auto; padding: 4px 8px 12px; }
    .A-side-label {
      font-size: 11px; font-weight: 600; color: var(--faint);
      padding: 8px 10px 6px; letter-spacing: 0.02em;
    }
    /* Capsule selection — NOT left-edge bar */
    .A-repo {
      display: flex; flex-direction: column; gap: 2px;
      padding: 8px 10px; margin-bottom: 2px;
      border-radius: 8px; cursor: pointer;
    }
    .A-repo:hover { background: var(--hover); }
    .A-repo.active {
      background: var(--selected);
    }
    .A-repo .name { font-size: 13px; font-weight: 500; color: var(--text); }
    .A-repo .path { font-size: 11px; color: var(--muted); }

    /* Center commits — white, no left border */
    .A-center {
      background: #fff;
      display: flex; flex-direction: column; min-width: 0;
      /* full-height divider only on the RIGHT, to the top */
      border-right: 1px solid var(--line);
    }
    .A-center-chrome {
      height: 36px; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px;
      /* no bottom border */
    }
    .A-center-chrome select {
      height: 26px; border: 1px solid var(--line); border-radius: 6px;
      padding: 0 8px; background: #fff; color: var(--text); min-width: 140px;
    }
    .A-center-chrome input {
      flex: 1; height: 26px; border: 1px solid var(--line); border-radius: 6px;
      padding: 0 8px; background: #fff; min-width: 0;
    }
    .A-center-chrome .cmp {
      font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted);
      flex-shrink: 0;
    }
    .A-commits { flex: 1; overflow: auto; }
    .A-commit {
      display: grid; grid-template-columns: 16px 1fr; gap: 10px;
      padding: 10px 14px; cursor: pointer; align-items: start;
    }
    .A-commit:hover { background: #f6f8fb; }
    .A-commit.in-range { background: var(--selected-soft); }
    .A-commit .check {
      width: 14px; height: 14px; margin-top: 2px;
      border: 1.5px solid #98a2b3; border-radius: 3px; background: #fff;
    }
    .A-commit.in-range .check {
      background: var(--accent); border-color: var(--accent);
      box-shadow: inset 0 0 0 2px #fff;
    }
    .A-commit .msg { font-size: 13px; font-weight: 500; }
    .A-commit .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Right: FILE TREE — shares the full-height left border via center's border-right */
    .A-files {
      background: #fff;
      display: flex; flex-direction: column; min-width: 0;
    }
    .A-files-chrome {
      height: 36px; flex-shrink: 0;
      display: flex; align-items: center;
      padding: 0 12px;
      font-size: 12px; font-weight: 600; color: var(--muted);
      /* no bottom border; vertical divider already from center */
    }
    .A-tree { flex: 1; overflow: auto; padding: 4px 6px 12px; font-size: 12px; }
    .A-tree details { margin: 0; }
    .A-tree summary {
      list-style: none; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      padding: 4px 6px; border-radius: 6px; user-select: none;
    }
    .A-tree summary::-webkit-details-marker { display: none; }
    .A-tree summary:hover { background: #f6f8fb; }
    .A-tree .twisty {
      width: 12px; color: var(--faint); font-size: 9px; text-align: center; flex-shrink: 0;
    }
    .A-tree details[open] > summary .twisty { transform: rotate(90deg); display: inline-block; }
    .A-tree .folder-kids { padding-left: 14px; }
    .A-tree .leaf {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 6px 4px 18px; border-radius: 6px; cursor: pointer;
    }
    .A-tree .leaf:hover { background: #f6f8fb; }
    .A-tree .leaf.active { background: var(--selected-soft); }
    .A-tree .badge {
      font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 500; width: 12px;
    }
    .A-tree .badge.M { color: #9a6700; }
    .A-tree .badge.A { color: var(--add); }
    .A-tree .badge.D { color: var(--del); }
    .A-tree .stats { margin-left: auto; font-size: 10px; color: var(--faint); }

    /* ========== Diff window — full-height tree|diff, color only ========== */
    .A-diff-cols {
      flex: 1; display: flex; min-height: 0;
    }
    .A-diff-tree {
      width: 200px; flex-shrink: 0;
      background: var(--sidebar);
      display: flex; flex-direction: column;
      min-width: 0; overflow: hidden;
      /* no vertical rule — frost vs white only, runs to window top */
      transition: width 200ms ease;
    }
    .A-diff-tree.collapsed { width: 0; }
    .A-diff-tree-chrome {
      height: 36px; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 0 8px 0 12px;
      /* no bottom border */
    }
    .A-diff-tree-body { flex: 1; overflow: auto; padding: 4px 6px 12px; }

    .A-diff-main {
      flex: 1; min-width: 0;
      background: #fff;
      display: flex; flex-direction: column;
    }
    .A-diff-main-chrome {
      height: 36px; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px;
      /* no bottom border — not a titlebar rule */
    }
    .A-diff-main-chrome .path {
      flex: 1; min-width: 0;
      font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted);
    }
    .A-diff-main-chrome .count { font-size: 12px; color: var(--muted); flex-shrink: 0; }

    .A-dual-wrap {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
    }
    .A-dual-heads {
      display: grid; grid-template-columns: 1fr 56px 1fr;
      flex-shrink: 0;
      font-size: 11px; color: var(--muted);
    }
    .A-dual-heads > div {
      padding: 4px 10px 8px;
      background: transparent;
    }
    .A-dual-heads .mid { background: transparent; }

    .A-dual {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 1fr 56px 1fr;
    }
    .A-code {
      overflow: auto; /* own scrollbar */
      font-family: "IBM Plex Mono", monospace; font-size: 12px;
      line-height: 20px;
      background: #fff;
    }
    .A-code .line {
      min-height: 20px; padding: 0 12px; white-space: pre;
    }
    .A-code .line.mod { background: var(--mod-bg); }
    .A-code .line.add { background: var(--add-bg); }
    .A-code .line.del { background: var(--del-bg); }
    .A-code .line.gap {
      background: repeating-linear-gradient(
        -45deg, #f0f2f5, #f0f2f5 4px, #e6e9ee 4px, #e6e9ee 8px
      );
      min-height: 10px;
    }
    .A-code .kw { color: #0033b3; font-weight: 500; }
    .A-code .str { color: #067d17; }
    .A-code .cm { color: #8c8c8c; }

    /* Central gutter: two line-number columns + connectors */
    .A-gutter {
      background: #f7f8fb;
      display: grid;
      grid-template-columns: 1fr 1fr;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      line-height: 20px;
      color: var(--faint);
      position: relative;
      overflow: hidden;
      user-select: none;
      box-shadow: inset 1px 0 0 #e8eaef, inset -1px 0 0 #e8eaef;
    }
    .A-gutter .col { text-align: right; padding-right: 6px; }
    .A-gutter .col.right { text-align: left; padding-left: 6px; padding-right: 0; }
    .A-gutter .ln { height: 20px; }
    .A-gutter .ln.mod { background: var(--mod-bg); color: #5b6b85; }
    .A-gutter .ribbon {
      position: absolute;
      left: 0; right: 0;
      background: rgba(36, 87, 214, 0.14);
      border-radius: 2px;
      pointer-events: none;
    }
    .A-gutter .chev {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-size: 10px; color: var(--accent); line-height: 20px;
      pointer-events: none;
    }

    /* B/C kept minimal stubs so switcher still works */
    .stub {
      flex: 1; display: grid; place-items: center; padding: 40px;
      color: var(--muted); text-align: center; line-height: 1.5;
    }
    .stub strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="proto-root"><div class="desk" id="desk"></div></div>
  <pre class="state-dump" id="stateDump"></pre>
  <div id="proto-switcher">
    <button type="button" id="prevVar">‹</button>
    <div class="label">
      <div id="varLabel">A</div>
      <div class="hint">← → · A is the chosen direction</div>
    </div>
    <button type="button" id="nextVar">›</button>
  </div>

  <script>
    const VARIANTS = [
      { key: "A", name: "Beads rail (chosen)" },
      { key: "B", name: "Commit stage (parked)" },
      { key: "C", name: "Review desk (parked)" },
    ];

    const MOCK = {
      reposCollapsed: false,
      diffTreeCollapsed: false,
      branch: "feature/diff-align",
      branches: ["feature/diff-align", "main", "release/0.1"],
      comparison: { base: "c7d8e9f", head: "a1b2c3d" },
      repos: [
        { id: "rf", name: "ReviewFox", path: "~/Dev/ReviewFox", active: true },
        { id: "bv", name: "BeadsViewer", path: "~/Dev/BeadsViewer", active: false },
        { id: "zed", name: "zed", path: "~/src/zed", active: false },
      ],
      commits: [
        { sha: "a1b2c3d", msg: "Align replace hunks as many-to-many", author: "alan", time: "2h", inRange: true },
        { sha: "e4f5a6b", msg: "Add DraftComment anchor dual-key", author: "alan", time: "5h", inRange: true },
        { sha: "c7d8e9f", msg: "Wire Comparison from commit selection", author: "alan", time: "1d", inRange: false },
        { sha: "0123456", msg: "Scaffold GPUI app shell", author: "alan", time: "2d", inRange: false },
        { sha: "789abcd", msg: "Initial import", author: "alan", time: "3d", inRange: false },
      ],
      selectedFile: "src/diff/alignment.rs",
      // nested tree, not a flat list
      tree: [
        {
          name: "src",
          kids: [
            {
              name: "diff",
              kids: [
                { path: "src/diff/alignment.rs", name: "alignment.rs", status: "M", plus: 42, minus: 18 },
                { path: "src/diff/hunk.rs", name: "hunk.rs", status: "A", plus: 88, minus: 0 },
              ],
            },
            {
              name: "review",
              kids: [
                { path: "src/review/anchor.rs", name: "anchor.rs", status: "M", plus: 31, minus: 9 },
              ],
            },
            {
              name: "export",
              kids: [
                { path: "src/export/narrative.rs", name: "narrative.rs", status: "A", plus: 120, minus: 0 },
              ],
            },
          ],
        },
        { path: "CONTEXT.md", name: "CONTEXT.md", status: "M", plus: 40, minus: 2 },
      ],
    };

    function getVariant() {
      const v = new URLSearchParams(location.search).get("variant") || "A";
      return VARIANTS.some((x) => x.key === v) ? v : "A";
    }
    function setVariant(key) {
      const url = new URL(location.href);
      url.searchParams.set("variant", key);
      history.replaceState(null, "", url);
      render();
    }
    function cycle(dir) {
      const i = VARIANTS.findIndex((x) => x.key === getVariant());
      setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }
    function dumpState() {
      const v = getVariant();
      document.getElementById("stateDump").textContent = JSON.stringify(
        {
          variant: v,
          note: "A refined: no titlebar rules; color boundaries; full-height commit|tree rule; capsule repo select; real file tree; CLion center line nos",
          comparison: MOCK.comparison,
          reposCollapsed: MOCK.reposCollapsed,
          diffTreeCollapsed: MOCK.diffTreeCollapsed,
          selectedFile: MOCK.selectedFile,
          range: MOCK.commits.filter((c) => c.inRange).map((c) => c.sha),
        },
        null,
        2
      );
    }

    function sidebarToggleIcon() {
      return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="2" y="2.5" width="12" height="11" rx="1.5"/>
        <path d="M6.5 2.5v11"/>
      </svg>`;
    }

    function renderTree(nodes, open = true) {
      return nodes
        .map((n) => {
          if (n.kids) {
            return `<details ${open ? "open" : ""}>
              <summary><span class="twisty">▶</span><span>${esc(n.name)}</span></summary>
              <div class="folder-kids">${renderTree(n.kids, true)}</div>
            </details>`;
          }
          const active = n.path === MOCK.selectedFile ? "active" : "";
          return `<div class="leaf ${active}" data-file="${esc(n.path)}">
            <span class="badge ${esc(n.status)}">${esc(n.status)}</span>
            <span class="truncate">${esc(n.name)}</span>
            <span class="stats">+${n.plus} −${n.minus}</span>
          </div>`;
        })
        .join("");
    }

    /** Dual panes + center line numbers (CLion-like). Rows are visual-aligned. */
    function dualModel() {
      // visual rows: each has left text, right text, left ln, right ln, kind
      return [
        { l: 18, r: 18, left: '<span class="kw">pub enum</span> Alignment {', right: '<span class="kw">pub enum</span> Alignment {', k: "" },
        { l: 19, r: 19, left: "    Equal { old: u32, new: u32 },", right: "    Equal { old: u32, new: u32 },", k: "" },
        { l: 20, r: null, left: "    Insert { after_old: u32, news: Range },", right: "", k: "del" },
        { l: 21, r: null, left: "    Delete { olds: Range, at_new: u32 },", right: "", k: "del" },
        { l: 22, r: 20, left: "    Change { olds: Range, news: Range },", right: "    Replace { olds: LineSpan, news: LineSpan },", k: "mod" },
        { l: null, r: 21, left: "", right: "    Insert { after_old: u32, news: LineSpan },", k: "add" },
        { l: null, r: 22, left: "", right: "    Delete { olds: LineSpan, at_new: u32 },", k: "add" },
        { l: 23, r: 23, left: "}", right: "}", k: "" },
        { l: 24, r: 24, left: "", right: "", k: "" },
        { l: 25, r: 25, left: '<span class="kw">impl</span> Alignment {', right: '<span class="kw">impl</span> Alignment {', k: "" },
        { l: 26, r: 26, left: "    <span class=\"kw\">fn</span> is_change(&self) -> bool {", right: "    <span class=\"kw\">fn</span> is_replace(&self) -> bool {", k: "mod" },
        { l: 27, r: 27, left: "        matches!(self, Self::Change { .. })", right: "        matches!(self, Self::Replace { .. })", k: "mod" },
        { l: 28, r: 28, left: "    }", right: "    }", k: "" },
        { l: 29, r: 29, left: "}", right: "}", k: "" },
      ];
    }

    function renderDual() {
      const rows = dualModel();
      const left = rows
        .map((row) => {
          if (row.k === "add" && !row.left) return `<div class="line gap"></div>`;
          return `<div class="line ${row.k}">${row.left || " "}</div>`;
        })
        .join("");
      const right = rows
        .map((row) => {
          if (row.k === "del" && !row.right) return `<div class="line gap"></div>`;
          return `<div class="line ${row.k}">${row.right || " "}</div>`;
        })
        .join("");
      const lnL = rows
        .map((row) => `<div class="ln ${row.k}">${row.l ?? ""}</div>`)
        .join("");
      const lnR = rows
        .map((row) => `<div class="ln ${row.k}">${row.r ?? ""}</div>`)
        .join("");
      // ribbons covering mod/add/del block roughly rows 2–6 (0-based) and 10–11
      return `
        <div class="A-dual-heads">
          <div class="truncate mono">alignment.rs · ${esc(MOCK.comparison.base)}</div>
          <div class="mid"></div>
          <div class="truncate mono">alignment.rs · ${esc(MOCK.comparison.head)}</div>
        </div>
        <div class="A-dual">
          <div class="A-code" id="codeL">${left}</div>
          <div class="A-gutter" id="gutter">
            <div class="ribbon" style="top:${2 * 20}px;height:${5 * 20}px"></div>
            <div class="ribbon" style="top:${10 * 20}px;height:${2 * 20}px"></div>
            <div class="chev" style="top:${4 * 20}px">»</div>
            <div class="chev" style="top:${10 * 20}px">»</div>
            <div class="col">${lnL}</div>
            <div class="col right">${lnR}</div>
          </div>
          <div class="A-code" id="codeR">${right}</div>
        </div>`;
    }

    function syncScroll() {
      const L = document.getElementById("codeL");
      const R = document.getElementById("codeR");
      const G = document.getElementById("gutter");
      if (!L || !R || !G) return;
      let lock = false;
      const sync = (src, a, b) => {
        src.addEventListener("scroll", () => {
          if (lock) return;
          lock = true;
          a.scrollTop = src.scrollTop;
          b.scrollTop = src.scrollTop;
          lock = false;
        });
      };
      // demo: sync all three; each pane still has its own scrollbar
      sync(L, R, G);
      sync(R, L, G);
    }

    function renderA(desk) {
      desk.innerHTML = `
        <div class="win A-main">
          <div class="A-cols ${MOCK.reposCollapsed ? "repos-collapsed" : ""}">
            <aside class="A-side">
              <div class="A-side-chrome">
                <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
                <button type="button" class="A-side-toggle" data-act="toggle-repos" title="Hide sidebar">
                  ${sidebarToggleIcon()}
                </button>
              </div>
              <div class="A-side-body">
                <div class="A-side-label">Repositories</div>
                ${MOCK.repos
                  .map(
                    (r) => `
                  <div class="A-repo ${r.active ? "active" : ""}" data-repo="${esc(r.id)}">
                    <div class="name">${esc(r.name)}</div>
                    <div class="path truncate">${esc(r.path)}</div>
                  </div>`
                  )
                  .join("")}
              </div>
            </aside>
            <section class="A-center">
              <div class="A-center-chrome">
                ${
                  MOCK.reposCollapsed
                    ? `<button type="button" class="A-side-toggle" data-act="toggle-repos" title="Show sidebar">${sidebarToggleIcon()}</button>`
                    : ""
                }
                <select data-act="branch">${MOCK.branches
                  .map((b) => `<option ${b === MOCK.branch ? "selected" : ""}>${esc(b)}</option>`)
                  .join("")}</select>
                <input placeholder="Filter commits" />
                <span class="cmp">${esc(MOCK.comparison.base)}..${esc(MOCK.comparison.head)}</span>
              </div>
              <div class="A-commits">
                ${MOCK.commits
                  .map(
                    (c) => `
                  <div class="A-commit ${c.inRange ? "in-range" : ""}" data-sha="${esc(c.sha)}">
                    <div class="check"></div>
                    <div>
                      <div class="msg">${esc(c.msg)}</div>
                      <div class="sub mono">${esc(c.sha)} · ${esc(c.author)} · ${esc(c.time)}</div>
                    </div>
                  </div>`
                  )
                  .join("")}
              </div>
            </section>
            <aside class="A-files">
              <div class="A-files-chrome">Changes</div>
              <div class="A-tree">${renderTree(MOCK.tree)}</div>
            </aside>
          </div>
        </div>
        <div class="win A-diff">
          <div class="A-diff-cols">
            <aside class="A-diff-tree ${MOCK.diffTreeCollapsed ? "collapsed" : ""}">
              <div class="A-diff-tree-chrome">
                <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
                <button type="button" class="A-side-toggle" data-act="toggle-diff-tree" title="Hide file tree">
                  ${sidebarToggleIcon()}
                </button>
              </div>
              <div class="A-diff-tree-body">
                <div class="A-tree">${renderTree(MOCK.tree)}</div>
              </div>
            </aside>
            <section class="A-diff-main">
              <div class="A-diff-main-chrome">
                ${
                  MOCK.diffTreeCollapsed
                    ? `<button type="button" class="A-side-toggle" data-act="toggle-diff-tree" title="Show file tree">${sidebarToggleIcon()}</button>`
                    : ""
                }
                <div class="path truncate">${esc(MOCK.selectedFile)}</div>
                <div class="count">2 differences</div>
              </div>
              <div class="A-dual-wrap">${renderDual()}</div>
            </section>
          </div>
        </div>`;
    }

    function renderParked(desk, name) {
      desk.innerHTML = `<div class="win" style="flex:1"><div class="stub">
        <div><strong>${esc(name)}</strong> parked.<br/>Chosen direction is <strong>A (Beads rail)</strong> — switch back with ←.</div>
      </div></div>`;
    }

    function bind(desk) {
      desk.querySelectorAll("[data-act='toggle-repos']").forEach((el) =>
        el.addEventListener("click", () => {
          MOCK.reposCollapsed = !MOCK.reposCollapsed;
          render();
        })
      );
      desk.querySelectorAll("[data-act='toggle-diff-tree']").forEach((el) =>
        el.addEventListener("click", () => {
          MOCK.diffTreeCollapsed = !MOCK.diffTreeCollapsed;
          render();
        })
      );
      desk.querySelectorAll("[data-file]").forEach((el) =>
        el.addEventListener("click", () => {
          MOCK.selectedFile = el.getAttribute("data-file");
          render();
        })
      );
      desk.querySelectorAll("[data-repo]").forEach((el) =>
        el.addEventListener("click", () => {
          const id = el.getAttribute("data-repo");
          MOCK.repos.forEach((r) => (r.active = r.id === id));
          render();
        })
      );
      desk.querySelectorAll("[data-sha]").forEach((el) =>
        el.addEventListener("click", (e) => {
          const sha = el.getAttribute("data-sha");
          if (e.shiftKey) {
            const idx = MOCK.commits.findIndex((c) => c.sha === sha);
            const first = MOCK.commits.findIndex((c) => c.inRange);
            const from = Math.min(first >= 0 ? first : idx, idx);
            const to = Math.max(first >= 0 ? first : idx, idx);
            MOCK.commits.forEach((c, i) => (c.inRange = i >= from && i <= to));
          } else {
            MOCK.commits.forEach((c) => (c.inRange = c.sha === sha));
          }
          const range = MOCK.commits.filter((c) => c.inRange);
          if (range.length) {
            MOCK.comparison.head = range[0].sha;
            const last = range[range.length - 1];
            const lastIdx = MOCK.commits.findIndex((c) => c.sha === last.sha);
            MOCK.comparison.base =
              lastIdx + 1 < MOCK.commits.length ? MOCK.commits[lastIdx + 1].sha : last.sha + "^";
          }
          render();
        })
      );
    }

    function render() {
      const v = getVariant();
      const meta = VARIANTS.find((x) => x.key === v);
      document.getElementById("varLabel").textContent = `${v} (${meta.name})`;
      const desk = document.getElementById("desk");
      if (v === "A") {
        renderA(desk);
        bind(desk);
        requestAnimationFrame(syncScroll);
      } else {
        renderParked(desk, meta.name);
      }
      dumpState();
    }

    document.getElementById("prevVar").onclick = () => cycle(-1);
    document.getElementById("nextVar").onclick = () => cycle(1);
    document.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable))
        return;
      if (e.key === "ArrowLeft") cycle(-1);
      if (e.key === "ArrowRight") cycle(1);
    });
    render();
  </script>
</body>
</html>
