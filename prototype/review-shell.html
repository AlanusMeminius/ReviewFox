<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReviewFox UI prototype (throwaway)</title>
  <!--
    PROTOTYPE — throwaway. Not production.
    Question: ReviewFox main + Diff chrome look.
    VERDICT (2026-09-25): A accepted — see docs/adr/0003-beads-rail-shell-from-prototype-a.md
    B/C parked. Visual mirror of theme.rs + app_view / diff_window shell
    (frost desk + white islands; Diff dual-pane also in prototype/diff-view.html).
    open prototype/review-shell.html · Diff: prototype/diff-view.html
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #172033;
      --muted: #596579;
      --faint: #98a2b3;
      --line: #dfe3ea;
      --surface: #ffffff;
      --frost: #f4f5f7;
      --hover: #e9ebef;
      --accent: #2457d6;
      --range: #f1f5ff;
      --add: #1a7f4b;
      --add-bg: #e8f7ee;
      --del: #b42318;
      --del-bg: #d8dce1;
      --mod-bg: #e8f0fe;
      --chg: #b9ceee;
      --chrome: 32px;
      --sidebar-w: 188px;
      --files-w: 280px;
      --diff-tree-w: 200px;
      --island-inset: 12px;
      --island-top: 6px;
      --island-radius: 12px;
      --island-clearance: 304px;
      --row-h: 32px;
      --row-gap: 4px;
      --row-inset: 8px;
      --row-pad-x: 6px;
      --row-radius: 8px;
      --capsule: #ffffff;
      --capsule-hover: #e4e7ed;
      --desk-selected: rgba(0, 0, 0, 0.07);
      --desk-hover: rgba(0, 0, 0, 0.04);
      --island-shadow:
        0 4px 12px rgba(23, 32, 51, 0.08),
        0 12px 32px rgba(23, 32, 51, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 13px;
      color: var(--text);
      background: #c5ccd6;
      overflow: hidden;
    }
    button, input, select { font: inherit; }
    .proto-root {
      height: 100%; padding: 16px;
      display: flex; gap: 12px; align-items: stretch; justify-content: center;
    }
    .desk { display: flex; gap: 12px; max-width: 1280px; width: 100%; height: 100%; min-width: 0; }

    .win {
      background: var(--frost);
      border: 1px solid #b4bcc8;
      border-radius: 10px;
      box-shadow: 0 16px 36px rgba(23, 32, 51, 0.16);
      display: flex; flex-direction: column;
      overflow: hidden; min-width: 0;
    }
    .traffic { display: flex; gap: 6px; align-items: center; flex-shrink: 0; width: 52px; }
    .traffic i { width: 10px; height: 10px; border-radius: 50%; display: block; background: #d0d5de; }
    .traffic .r { background: #ff5f57; }
    .traffic .y { background: #febc2e; }
    .traffic .g { background: #28c840; }

    .mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
    .meta { font-size: 12px; color: var(--muted); }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #proto-switcher {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      z-index: 9999; display: flex; align-items: center; gap: 10px;
      background: #111827; color: #f9fafb; border-radius: 999px;
      padding: 8px 14px; box-shadow: 0 8px 28px rgba(0,0,0,.35);
      font-size: 13px; user-select: none;
    }
    #proto-switcher button {
      background: #374151; color: #fff; border: 0;
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    }
    #proto-switcher .label { min-width: 240px; text-align: center; }
    #proto-switcher .hint { color: #9ca3af; font-size: 11px; }
    .state-dump {
      position: fixed; right: 10px; bottom: 58px; z-index: 9998;
      width: 260px; max-height: 36vh; overflow: auto;
      background: #0f172a; color: #e2e8f0;
      font-family: "IBM Plex Mono", monospace; font-size: 10px;
      padding: 10px; border-radius: 8px; opacity: 0.9; white-space: pre-wrap;
    }

    .icon-btn {
      width: 26px; height: 26px; border: 0; border-radius: 6px;
      background: transparent; color: var(--muted); cursor: pointer;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* ========== A: frost desk + white islands ========== */
    .A-main { flex: 1.15; min-width: 0; }
    .A-diff { flex: 0.95; min-width: 0; }

    .titlebar {
      height: var(--chrome); flex-shrink: 0;
      display: flex; align-items: stretch; min-width: 0;
    }
    .titlebar-leading {
      width: var(--sidebar-w); flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0 0 12px;
    }
    .titlebar-leading.collapsed { width: auto; min-width: 90px; }
    .titlebar-leading.diff { width: var(--diff-tree-w); }
    .titlebar-leading.diff.collapsed { width: auto; min-width: 90px; }
    .titlebar-main {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 6px var(--island-inset) 0 var(--island-inset);
    }
    .branch-pill {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 999px; cursor: pointer;
      font-size: 12px; background: var(--capsule); flex-shrink: 0; border: 0; color: var(--text);
    }
    .branch-pill:hover { background: var(--hover); }
    .branch-pill select {
      border: 0; background: transparent; padding: 0; font-size: 12px; color: var(--text);
      max-width: 160px;
    }
    .cmp {
      margin-left: auto;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px; color: var(--muted);
    }
    .nav-capsule {
      display: flex; align-items: center; gap: 2px;
      padding: 2px; border-radius: 7px; background: var(--capsule);
      box-shadow: var(--island-shadow);
    }
    .nav-capsule .icon-btn { border-radius: 5px; }

    .body { flex: 1; min-height: 0; display: flex; overflow: hidden; }

    .side {
      width: var(--sidebar-w); flex-shrink: 0;
      display: flex; flex-direction: column; min-width: 0; overflow: hidden;
    }
    .side.collapsed { width: 0; overflow: hidden; }
    .side-body {
      flex: 1; overflow: auto;
      padding: 16px var(--row-inset) 8px;
      display: flex; flex-direction: column; gap: var(--row-gap);
    }
    .side-label {
      font-size: 11px; font-weight: 600; color: var(--faint);
      height: 24px; display: flex; align-items: center;
      padding: 0 var(--row-pad-x);
    }
    .A-repo {
      display: flex; flex-direction: column; justify-content: center; gap: 1px;
      min-height: var(--row-h);
      padding: 4px var(--row-pad-x);
      border-radius: var(--row-radius); cursor: pointer;
    }
    .A-repo:hover { background: var(--desk-hover); }
    .A-repo.active { background: var(--desk-selected); }
    .A-repo .name { font-size: 13px; font-weight: 500; }
    .A-repo .path { font-size: 11px; color: var(--muted); }

    .stage { flex: 1; min-width: 0; position: relative; overflow: hidden; }
    .commits-column {
      position: absolute; inset: 0;
      right: var(--island-clearance);
      display: flex; flex-direction: column;
      padding: var(--island-top) 0 var(--island-inset) var(--island-inset);
      min-width: 0;
    }
    .commit-island {
      flex: 1; min-height: 0;
      background: var(--surface);
      border-radius: var(--island-radius);
      box-shadow: var(--island-shadow);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .A-commits { flex: 1; overflow: auto; padding: 4px 0; }
    .A-commit {
      display: grid; grid-template-columns: 16px 1fr; gap: 10px;
      margin: 0 8px 2px; padding: 8px 10px; cursor: pointer; align-items: start;
      border-radius: 8px;
    }
    .A-commit:hover { background: #f6f8fb; }
    .A-commit.in-range { background: var(--range); }
    .A-commit .check {
      width: 14px; height: 14px; margin-top: 2px;
      border: 1.5px solid #98a2b3; border-radius: 3px; background: #fff;
    }
    .A-commit.in-range .check {
      background: var(--accent); border-color: var(--accent);
      box-shadow: inset 0 0 0 2px #fff;
    }
    .A-commit .msg { font-size: 13px; font-weight: 500; }
    .A-commit .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .changes {
      position: absolute;
      top: var(--island-top);
      right: var(--island-inset);
      bottom: var(--island-inset);
      width: var(--files-w);
      z-index: 5;
      display: flex; flex-direction: column;
      background: var(--surface);
      border-radius: var(--island-radius);
      box-shadow: var(--island-shadow);
      overflow: hidden;
    }
    .changes-chrome {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px 4px;
      font-size: 11px; font-weight: 600; color: var(--faint);
    }
    .open-diff {
      margin-left: auto;
      height: 26px; padding: 0 10px;
      border: 0; border-radius: 6px;
      background: var(--accent); color: #fff;
      font-size: 12px; font-weight: 500; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .open-diff:hover { filter: brightness(1.05); }

    .A-tree { flex: 1; overflow: auto; padding: 2px 6px 12px; font-size: 12px; }
    .A-tree details { margin: 0; }
    .A-tree summary {
      list-style: none; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      height: 22px; padding: 0 6px; margin: 0 4px 2px;
      border-radius: 4px; user-select: none;
    }
    .A-tree summary::-webkit-details-marker { display: none; }
    .A-tree summary:hover { background: #f6f8fb; }
    .A-tree .twisty {
      width: 12px; color: var(--faint); font-size: 9px; text-align: center; flex-shrink: 0;
    }
    .A-tree details[open] > summary .twisty { transform: rotate(90deg); display: inline-block; }
    .A-tree .folder-kids { padding-left: 14px; }
    .A-tree .leaf {
      display: flex; align-items: center; gap: 6px;
      height: 22px; padding: 0 6px 0 18px; margin: 0 4px 2px;
      border-radius: 4px; cursor: pointer;
    }
    .A-tree .leaf:hover { background: #f6f8fb; }
    .A-tree .leaf.active { background: var(--range); }
    .A-tree .badge {
      font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 500; width: 12px;
    }
    .A-tree .badge.M { color: #9a6700; }
    .A-tree .badge.A { color: var(--add); }
    .A-tree .badge.D { color: var(--del); }
    .A-tree .stats { margin-left: auto; font-size: 10px; color: var(--faint); }

    /* Diff window half */
    .diff-tree {
      width: var(--diff-tree-w); flex-shrink: 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .diff-tree.collapsed { width: 0; overflow: hidden; }
    .diff-tree-body { flex: 1; overflow: auto; padding: 8px var(--row-inset); }
    .diff-stage {
      flex: 1; min-width: 0;
      padding: var(--island-top) var(--island-inset) var(--island-inset) 0;
      display: flex; flex-direction: column; min-height: 0;
    }
    .diff-island {
      flex: 1; min-height: 0;
      background: var(--surface);
      border-radius: var(--island-radius);
      box-shadow: var(--island-shadow);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 36px 1fr;
      font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 22px;
    }
    .diff-pane { overflow: hidden; padding: 12px 0; }
    .diff-pane .row { display: flex; min-height: 22px; }
    .diff-pane .ln {
      width: 36px; flex-shrink: 0; text-align: right; padding-right: 8px;
      color: var(--faint); user-select: none;
    }
    .diff-pane .code { flex: 1; padding-right: 8px; white-space: pre; overflow: hidden; }
    .diff-pane .row.add { background: var(--add-bg); }
    .diff-pane .row.del { background: var(--del-bg); }
    .diff-pane .row.mod { background: var(--mod-bg); }
    .diff-gutter {
      background: #fafbfc; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    }
    .file-status {
      flex-shrink: 0; padding: 0 12px 8px;
      font-size: 12px; color: var(--muted);
    }
    .file-status strong { color: var(--text); font-weight: 500; }

    .stub {
      flex: 1; display: grid; place-items: center; padding: 40px;
      color: var(--muted); text-align: center; line-height: 1.5;
    }
    .stub strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="proto-root"><div class="desk" id="desk"></div></div>
  <pre class="state-dump" id="stateDump"></pre>
  <div id="proto-switcher">
    <button type="button" id="prevVar">‹</button>
    <div class="label">
      <div id="varLabel">A</div>
      <div class="hint">← → · A is the chosen direction</div>
    </div>
    <button type="button" id="nextVar">›</button>
    <a href="diff-view.html" style="color:#93c5fd;text-decoration:none;margin-left:8px;font-size:12px">Diff →</a>
  </div>

  <script>
    const VARIANTS = [
      { key: "A", name: "Beads rail (chosen)" },
      { key: "B", name: "Commit stage (parked)" },
      { key: "C", name: "Review desk (parked)" },
    ];

    const MOCK = {
      reposCollapsed: false,
      diffTreeCollapsed: false,
      branch: "feature/diff-align",
      branches: ["feature/diff-align", "main", "release/0.1"],
      comparison: { base: "c7d8e9f", head: "a1b2c3d" },
      repos: [
        { id: "rf", name: "ReviewFox", path: "~/Dev/ReviewFox", active: true },
        { id: "bv", name: "BeadsViewer", path: "~/Dev/BeadsViewer", active: false },
        { id: "zed", name: "zed", path: "~/src/zed", active: false },
      ],
      commits: [
        { sha: "a1b2c3d", msg: "Align replace hunks as many-to-many", author: "alan", time: "2h", inRange: true },
        { sha: "e4f5a6b", msg: "Add DraftComment anchor dual-key", author: "alan", time: "5h", inRange: true },
        { sha: "c7d8e9f", msg: "Wire Comparison from commit selection", author: "alan", time: "1d", inRange: false },
        { sha: "0123456", msg: "Scaffold GPUI app shell", author: "alan", time: "2d", inRange: false },
        { sha: "789abcd", msg: "Initial import", author: "alan", time: "3d", inRange: false },
      ],
      selectedFile: "src/diff/alignment.rs",
      tree: [
        {
          name: "src",
          kids: [
            {
              name: "diff",
              kids: [
                { path: "src/diff/alignment.rs", name: "alignment.rs", status: "M", plus: 42, minus: 18 },
                { path: "src/diff/hunk.rs", name: "hunk.rs", status: "A", plus: 88, minus: 0 },
              ],
            },
            {
              name: "review",
              kids: [
                { path: "src/review/anchor.rs", name: "anchor.rs", status: "M", plus: 31, minus: 9 },
              ],
            },
            {
              name: "export",
              kids: [
                { path: "src/export/narrative.rs", name: "narrative.rs", status: "A", plus: 120, minus: 0 },
              ],
            },
          ],
        },
        { path: "CONTEXT.md", name: "CONTEXT.md", status: "M", plus: 40, minus: 2 },
      ],
    };

    function getVariant() {
      const v = new URLSearchParams(location.search).get("variant") || "A";
      return VARIANTS.some((x) => x.key === v) ? v : "A";
    }
    function setVariant(key) {
      const url = new URL(location.href);
      url.searchParams.set("variant", key);
      history.replaceState(null, "", url);
      render();
    }
    function cycle(dir) {
      const i = VARIANTS.findIndex((x) => x.key === getVariant());
      setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }
    function dumpState() {
      const v = getVariant();
      document.getElementById("stateDump").textContent = JSON.stringify(
        {
          variant: v,
          note: "A: frost desk + islands; Diff shell mirror; dual-pane in diff-view.html",
          comparison: MOCK.comparison,
          reposCollapsed: MOCK.reposCollapsed,
          diffTreeCollapsed: MOCK.diffTreeCollapsed,
          selectedFile: MOCK.selectedFile,
          range: MOCK.commits.filter((c) => c.inRange).map((c) => c.sha),
        },
        null,
        2
      );
    }

    function sidebarToggleIcon() {
      return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="2" y="2.5" width="12" height="11" rx="1.5"/>
        <path d="M6.5 2.5v11"/>
      </svg>`;
    }

    function renderTree(nodes, open = true) {
      return nodes
        .map((n) => {
          if (n.kids) {
            return `<details ${open ? "open" : ""}>
              <summary><span class="twisty">▶</span><span>${esc(n.name)}</span></summary>
              <div class="folder-kids">${renderTree(n.kids, true)}</div>
            </details>`;
          }
          const active = n.path === MOCK.selectedFile ? "active" : "";
          return `<div class="leaf ${active}" data-file="${esc(n.path)}">
            <span class="badge ${esc(n.status)}">${esc(n.status)}</span>
            <span class="truncate">${esc(n.name)}</span>
            <span class="stats">+${n.plus} −${n.minus}</span>
          </div>`;
        })
        .join("");
    }

    function renderA(desk) {
      const leadCollapse = MOCK.reposCollapsed ? "collapsed" : "";
      const diffLeadCollapse = MOCK.diffTreeCollapsed ? "collapsed" : "";
      desk.innerHTML = `
        <div class="win A-main">
          <header class="titlebar">
            <div class="titlebar-leading ${leadCollapse}">
              <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
              <button type="button" class="icon-btn" data-act="toggle-repos" title="Toggle sidebar">${sidebarToggleIcon()}</button>
            </div>
            <div class="titlebar-main">
              <label class="branch-pill">
                <select data-act="branch">${MOCK.branches
                  .map((b) => `<option ${b === MOCK.branch ? "selected" : ""}>${esc(b)}</option>`)
                  .join("")}</select>
              </label>
              <span class="cmp">${esc(MOCK.comparison.base)}..${esc(MOCK.comparison.head)}</span>
            </div>
          </header>
          <div class="body">
            <aside class="side ${MOCK.reposCollapsed ? "collapsed" : ""}">
              <div class="side-body">
                <div class="side-label">Repositories</div>
                ${MOCK.repos
                  .map(
                    (r) => `
                  <div class="A-repo ${r.active ? "active" : ""}" data-repo="${esc(r.id)}">
                    <div class="name">${esc(r.name)}</div>
                    <div class="path truncate">${esc(r.path)}</div>
                  </div>`
                  )
                  .join("")}
              </div>
            </aside>
            <section class="stage">
              <div class="commits-column">
                <div class="commit-island">
                  <div class="A-commits">
                    ${MOCK.commits
                      .map(
                        (c) => `
                      <div class="A-commit ${c.inRange ? "in-range" : ""}" data-sha="${esc(c.sha)}">
                        <div class="check"></div>
                        <div>
                          <div class="msg">${esc(c.msg)}</div>
                          <div class="sub mono">${esc(c.sha)} · ${esc(c.author)} · ${esc(c.time)}</div>
                        </div>
                      </div>`
                      )
                      .join("")}
                  </div>
                </div>
              </div>
              <aside class="changes">
                <div class="changes-chrome">
                  <span>Changes</span>
                  <a class="open-diff" href="diff-view.html">Open Diff</a>
                </div>
                <div class="A-tree">${renderTree(MOCK.tree)}</div>
              </aside>
            </section>
          </div>
        </div>

        <div class="win A-diff">
          <header class="titlebar">
            <div class="titlebar-leading diff ${diffLeadCollapse}">
              <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
              <button type="button" class="icon-btn" data-act="toggle-diff-tree" title="Toggle file tree">${sidebarToggleIcon()}</button>
            </div>
            <div class="titlebar-main">
              <div class="nav-capsule">
                <button type="button" class="icon-btn" title="Prev hunk">↑</button>
                <button type="button" class="icon-btn" title="Next hunk">↓</button>
              </div>
              <span class="cmp truncate" style="margin-left:0">${esc(MOCK.selectedFile)}</span>
            </div>
          </header>
          <div class="body">
            <aside class="diff-tree ${MOCK.diffTreeCollapsed ? "collapsed" : ""}">
              <div class="diff-tree-body A-tree">${renderTree(MOCK.tree)}</div>
            </aside>
            <section class="diff-stage">
              <div class="file-status"><strong>${esc(MOCK.selectedFile.split("/").pop())}</strong> · hunk 1 of 2</div>
              <div class="diff-island">
                <div class="diff-pane">
                  <div class="row del"><span class="ln">10</span><span class="code">fn align(old, new) {</span></div>
                  <div class="row del"><span class="ln">11</span><span class="code">    pair_lines(old, new)</span></div>
                  <div class="row"><span class="ln">12</span><span class="code">}</span></div>
                </div>
                <div class="diff-gutter"></div>
                <div class="diff-pane">
                  <div class="row add"><span class="ln">10</span><span class="code">fn align(old, new) {</span></div>
                  <div class="row mod"><span class="ln">11</span><span class="code">    many_to_many(old, new)</span></div>
                  <div class="row add"><span class="ln">12</span><span class="code">        .with_replace()</span></div>
                  <div class="row"><span class="ln">13</span><span class="code">}</span></div>
                </div>
              </div>
            </section>
          </div>
        </div>`;
    }

    function renderParked(desk, name) {
      desk.innerHTML = `<div class="win" style="flex:1"><div class="stub">
        <div><strong>${esc(name)}</strong> parked.<br/>Chosen direction is <strong>A (Beads rail)</strong> — switch back with ←.</div>
      </div></div>`;
    }

    function bind(desk) {
      desk.querySelectorAll("[data-act='toggle-repos']").forEach((el) =>
        el.addEventListener("click", () => {
          MOCK.reposCollapsed = !MOCK.reposCollapsed;
          render();
        })
      );
      desk.querySelectorAll("[data-act='toggle-diff-tree']").forEach((el) =>
        el.addEventListener("click", () => {
          MOCK.diffTreeCollapsed = !MOCK.diffTreeCollapsed;
          render();
        })
      );
      desk.querySelectorAll("[data-act='branch']").forEach((el) =>
        el.addEventListener("change", () => {
          MOCK.branch = el.value;
          render();
        })
      );
      desk.querySelectorAll("[data-file]").forEach((el) =>
        el.addEventListener("click", () => {
          MOCK.selectedFile = el.getAttribute("data-file");
          render();
        })
      );
      desk.querySelectorAll("[data-repo]").forEach((el) =>
        el.addEventListener("click", () => {
          const id = el.getAttribute("data-repo");
          MOCK.repos.forEach((r) => (r.active = r.id === id));
          render();
        })
      );
      desk.querySelectorAll("[data-sha]").forEach((el) =>
        el.addEventListener("click", (e) => {
          const sha = el.getAttribute("data-sha");
          if (e.shiftKey) {
            const idx = MOCK.commits.findIndex((c) => c.sha === sha);
            const first = MOCK.commits.findIndex((c) => c.inRange);
            const from = Math.min(first >= 0 ? first : idx, idx);
            const to = Math.max(first >= 0 ? first : idx, idx);
            MOCK.commits.forEach((c, i) => (c.inRange = i >= from && i <= to));
          } else {
            MOCK.commits.forEach((c) => (c.inRange = c.sha === sha));
          }
          const range = MOCK.commits.filter((c) => c.inRange);
          if (range.length) {
            MOCK.comparison.head = range[0].sha;
            const last = range[range.length - 1];
            const lastIdx = MOCK.commits.findIndex((c) => c.sha === last.sha);
            MOCK.comparison.base =
              lastIdx + 1 < MOCK.commits.length ? MOCK.commits[lastIdx + 1].sha : last.sha + "^";
          }
          render();
        })
      );
    }

    function render() {
      const v = getVariant();
      const meta = VARIANTS.find((x) => x.key === v);
      document.getElementById("varLabel").textContent = `${v} (${meta.name})`;
      const desk = document.getElementById("desk");
      if (v === "A") {
        renderA(desk);
        bind(desk);
      } else {
        renderParked(desk, meta.name);
      }
      dumpState();
    }

    document.getElementById("prevVar").onclick = () => cycle(-1);
    document.getElementById("nextVar").onclick = () => cycle(1);
    document.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable))
        return;
      if (e.key === "ArrowLeft") cycle(-1);
      if (e.key === "ArrowRight") cycle(1);
    });
    render();
  </script>
</body>
</html>
